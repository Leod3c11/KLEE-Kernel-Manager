name: Build APK

on:
  push:
    branches: [ main, master, codex/mt6899manager-release ]
  pull_request:
  workflow_dispatch:

# O workflow só lê o repositório; sem isso o GITHUB_TOKEN recebe as permissões padrão (mais amplas).
permissions:
  contents: read

# Um novo push na mesma branch cancela a compilação anterior em andamento.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build release APK
        run: |
          chmod +x gradlew
          # O wrapper baixa o Gradle de services.gradle.org / GitHub Releases, que às vezes dá timeout ou 504.
          # Tenta de novo; um erro de compilação de verdade falha as 4 vezes e derruba o job do mesmo jeito.
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease; then
              exit 0
            fi
            echo "::warning::Tentativa $attempt de 4 falhou"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: MT6899Manager-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
